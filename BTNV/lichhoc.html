<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Lịch học</title>

    <style>
        body {
            font-family: "Times New Roman", serif;
            text-align: center;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 28px;
        }

        table {
            border-collapse: collapse;
            margin: auto;
            width: 78%;
            font-size: 22px;
        }

        th, td {
            border: 1px solid #555;
            padding: 4px;
            text-align: center;
            height: 30px;
        }

        th {
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h1>LỊCH HỌC</h1>

    <table>
        <tr>
            <th>Thứ</th>
            <th>Hai</th>
            <th>Ba</th>
            <th>Tư</th>
            <th>Năm</th>
            <th>Sáu</th>
        </tr>

        <tr>
            <td rowspan="2">Sáng</td>

            <td>LTĐT</td>

            <td rowspan="2">CTDL-GT</td>

            <td rowspan="2">PTHT</td>

            <td>CSDL</td>

            <td rowspan="2">CSDL</td>
        </tr>

        <tr>
            <td>LTW</td>
            <td>LTW</td>
        </tr>

        <tr>
            <td rowspan="2">Chiều</td>

            <td>TDTT</td>

            <td>QTM</td>

            <td>TRR</td>

            <td colspan="2">TDTT</td>
        </tr>

        <tr>
            <td colspan="2">AV</td>

            <td>CSDL</td>

            <td colspan="2">CNTT CB</td>
        </tr>
    </table>

</body>
</html>
