<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2> Máy tính đơn giản </h2>
    <label for="a">Nhập số thứ nhất: </label>
    <input type="number" id="a">
    <br></br>
    <label for="b">Nhập số thứ hai: </label>
    <input type="number" id="b">
    <br></br>
    <button onclick="Cong()">Cộng</button>
    <button onclick="Tru()">Trừ</button>
    <button onclick="Nhan()">Nhân</button>
    <button onclick="Chia()">Chia</button>
    <p id="ketqua"></p>

    <script>
        function Cong() {
            let a = Number(document.getElementById("a").value);
            let b = Number(document.getElementById("b").value);
            document.getElementById("ketqua").innerHTML = "Kết quả: " + (a + b);
        }
        function Tru() {
            let a = Number(document.getElementById("a").value);
            let b = Number(document.getElementById("b").value);
            document.getElementById("ketqua").innerHTML = "Kết quả: " + (a - b);
        }
        function Nhan() {
            let a = Number(document.getElementById("a").value);
            let b = Number(document.getElementById("b").value);
            document.getElementById("ketqua").innerHTML = "Kết quả: " + (a * b);
        }
        function Chia() {
            let a = Number(document.getElementById("a").value);
            let b = Number(document.getElementById("b").value);
            if (b == 0) {
                document.getElementById("ketqua").innerHTML = "Không thể chia cho 0";
            } else {
                document.getElementById("ketqua").innerHTML = "Kết quả: " + (a / b);
            }
        }
    </script>
</body>
</html>
