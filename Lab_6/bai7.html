<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2> Xúc xắc may mắn </h2>
    <button onclick="Lacxucxac()">Lắc xúc xắc</button>
    <p id="ketqua"></p>

    <script>
        function Lacxucxac() {
            let so = Math.floor(Math.random() * 6) + 1;
            document.getElementById("ketqua").innerHTML = "Bạn lắc được: " + so;
        }
    </script>
</body>
</html>
