<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2> Chương trình tính tuổi </h2>
    <label for="year">Nhập năm sinh: </label>
    <input type="number" id="namsinh" >
    <br></br>
    <button onclick="Tinhtuoi()">Tính tuổi</button>
    <p id="ketqua"></p>

    <script>
        function Tinhtuoi() {
            let yearOfBirth = document.getElementById("namsinh").value;
            let currentYear = new Date().getFullYear();
            let yourage = currentYear - yearOfBirth;
            document.getElementById("ketqua").innerHTML = "Tuổi của bạn là: " + yourage;
        }
    </script>
</body>
</html>
