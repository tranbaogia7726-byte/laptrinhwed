<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2> Chương trình kiểm tra năm nhuận </h2>
    <label for="nam">Nhập một năm: </label>
    <input type="number" id="nam">
    <br></br>
    <button onclick="Kiemtra()">Kiểm tra</button>
    <p id="ketqua"></p>

    <script>
        function Kiemtra() {
            let nam = Number(document.getElementById("nam").value);
            let kq;
            if ((nam % 4 == 0 && nam % 100 != 0) || nam % 400 == 0) {
                kq = nam + " là năm nhuận";
            } else {
                kq = nam + " không phải năm nhuận";
            }
            document.getElementById("ketqua").innerHTML = kq;
        }
    </script>
</body>
</html>
