<!DOCTYPE html>
<html lang="vi">
  <head>
  <meta charset="UTF-8">
  <title>Bài tập: Cửa Hàng Online - Đăng Nhập</title>
    <style>
 * { box-sizing: border-box; }
  body {
    font-family: "Segoe UI", Arial, sans-serif;
    background: #f4f6f8;
    margin: 0;
    padding: 24px;
    color: #222;
  }
  h1 { text-align: center; color: #2c3e50; }
  h2 { margin-top: 0; color: #2c3e50; font-size: 18px; }
  .card {
    background: #fff;
    padding: 20px;
    border-radius: 8px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
  }

  /* ---- Màn hình đăng nhập / đăng ký ---- */
  #manHinhDangNhap {
    max-width: 360px;
    margin: 60px auto;
    text-align: center;
  }
  #manHinhDangNhap input {
    width: 100%;
    padding: 10px;
    margin-bottom: 10px;
    border: 1px solid #ccc;
    border-radius: 4px;
    font-size: 14px;
  }
  #manHinhDangNhap button {
    width: 48%;
    padding: 10px;
    margin-top: 6px;
    border: none;
    border-radius: 4px;
    font-size: 14px;
    cursor: pointer;
  }
  #btnDangNhap { background: #3498db; color: #fff; margin-right: 4%; }
  #btnDangNhap:hover { background: #2980b9; }
  #btnDangKy { background: #2ecc71; color: #fff; }
  #btnDangKy:hover { background: #27ae60; }
  .thong-bao { min-height: 20px; font-size: 13px; margin: 8px 0; }
  .loi { color: #e74c3c; }
  .thanh-cong { color: #27ae60; }

  /* ---- Màn hình cửa hàng ---- */
  .thanh-tren {
    max-width: 900px;
    margin: 0 auto 12px auto;
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: 12px;
    font-size: 14px;
  }
  .thanh-tren button {
    background: #95a5a6;
    color: #fff;
    border: none;
    border-radius: 4px;
    padding: 6px 12px;
    cursor: pointer;
    font-size: 13px;
  }
  .thanh-tren button:hover { background: #7f8c8d; }

  .layout {
    max-width: 900px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: 1.4fr 1fr;
    gap: 20px;
    align-items: start;
  }
  table { width: 100%; border-collapse: collapse; }
  th, td {
    padding: 10px;
    border-bottom: 1px solid #eee;
    text-align: left;
    font-size: 14px;
  }
  th { background: #34495e; color: #fff; }
  tr:hover { background: #f9f9f9; }
  button {
    cursor: pointer;
    border: none;
    border-radius: 4px;
    padding: 7px 12px;
    font-size: 13px;
  }
  .btn-them { background: #2ecc71; color: #fff; }
  .btn-them:hover { background: #27ae60; }
  .btn-xoa { background: #e74c3c; color: #fff; }
  .btn-xoa:hover { background: #c0392b; }
  .tong-tien {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 18px;
    font-weight: bold;
    margin: 16px 0;
    color: #2c3e50;
  }
  #btnThanhToan {
    width: 100%;
    background: #f39c12;
    color: #fff;
    padding: 12px;
    font-size: 15px;
    font-weight: bold;
  }
  #btnThanhToan:hover { background: #d68910; }
  .gio-trong {
    text-align: center;
    color: #999;
    padding: 20px 0;
  }
  </style>
  </head>
  <body>

  <!-- =========================================================
      MÀN HÌNH ĐĂNG NHẬP / ĐĂNG KÝ
      Đây là màn hình đầu tiên người dùng nhìn thấy. Sau khi
      đăng nhập thành công, màn hình này sẽ ẩn đi và màn hình
      cửa hàng bên dưới sẽ hiện ra.
      ========================================================= -->
  <div id="manHinhDangNhap" class="card">
    <h2>Đăng nhập / Đăng ký</h2>
    <input type="text" id="oTaiKhoan" placeholder="Tài khoản">
    <input type="password" id="oMatKhau" placeholder="Mật khẩu">
    <div class="thong-bao" id="thongBaoLoi"></div>
    <button id="btnDangNhap" onclick="dangNhap()">Đăng nhập</button>
    <button id="btnDangKy" onclick="dangKy()">Đăng ký</button>
    <p style="font-size:12px;color:#999;margin-top:12px;">
      Tài khoản mẫu có sẵn: <b>khach1</b> / mật khẩu <b>123456</b>
    </p>
  </div>

  <!-- =========================================================
      MÀN HÌNH CỬA HÀNG
      Bị ẩn (display: none) cho đến khi đăng nhập thành công.
      Phần sản phẩm / giỏ hàng ở đây đã code sẵn (bài trước em
      đã làm), không cần sửa gì trong khu vực này.
      ========================================================= -->
  <div id="manHinhCuaHang" style="display: none;">
    <div class="thanh-tren">
      Xin chào, <b id="tenDangNhap"></b>
      <button onclick="dangXuat()">Đăng xuất</button>
    </div>

    <h1>Cửa Hàng Online</h1>

    <div class="layout">
      <!-- DANH SÁCH SẢN PHẨM -->
      <div class="card">
        <h2>Danh sách sản phẩm</h2>
        <table>
          <thead>
            <tr>
              <th>Tên sản phẩm</th>
              <th>Giá</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="bangSanPham">
            <!-- JS sẽ điền dữ liệu vào đây -->
          </tbody>
        </table>
      </div>

      <!-- GIỎ HÀNG -->
      <div class="card">
        <h2>Giỏ hàng</h2>
        <div id="bangGioHang">
          <!-- JS sẽ điền dữ liệu vào đây -->
        </div>
        <div class="tong-tien">
          <span>Tổng tiền:</span>
          <span id="tongTien">0đ</span>
        </div>
        <button id="btnThanhToan" onclick="thanhToan()">Thanh toán</button>
      </div>
    </div>
  </div>


  <script>
  let danhSachTaiKhoan = [
    { taiKhoan: "khach1", matKhau: "123456" }
  ];

  // Tài khoản đang đăng nhập. null nghĩa là chưa đăng nhập - KHÔNG cần sửa
  let taiKhoanDangNhap = null;

  // Tham chiếu DOM - KHÔNG cần sửa phần này
  const oTaiKhoan = document.getElementById("oTaiKhoan");
  const oMatKhau = document.getElementById("oMatKhau");
  const oThongBaoLoi = document.getElementById("thongBaoLoi");
  const oManHinhDangNhap = document.getElementById("manHinhDangNhap");
  const oManHinhCuaHang = document.getElementById("manHinhCuaHang");
  const oTenDangNhap = document.getElementById("tenDangNhap");
  function timTaiKhoan(taiKhoan) {
    for (let i = 0; i < danhSachTaiKhoan.length; i++) {
      if (danhSachTaiKhoan[i].taiKhoan === taiKhoan) {
        return danhSachTaiKhoan[i];
      }
    }
    return null;

  }

  function dangKy() {
    const taiKhoan = oTaiKhoan.value;
    const matKhau = oMatKhau.value;

    if (timTaiKhoan(taiKhoan) !== null) {
      oThongBaoLoi.className = "thong-bao loi";
      oThongBaoLoi.textContent = "Tài khoản đã tồn tại, vui lòng chọn tên khác hoặc đăng nhập.";
      return;
    }

    danhSachTaiKhoan.push({ taiKhoan: taiKhoan, matKhau: matKhau });
    oThongBaoLoi.className = "thong-bao thanh-cong";
    oThongBaoLoi.textContent = "Đăng ký thành công! Bây giờ hãy đăng nhập.";

  }
  function dangNhap() {
    const taiKhoan = oTaiKhoan.value;
    const matKhau = oMatKhau.value;
    const tk = timTaiKhoan(taiKhoan);

    if (tk === null || tk.matKhau !== matKhau) {
      oThongBaoLoi.className = "thong-bao loi";
      oThongBaoLoi.textContent = "Sai tài khoản hoặc mật khẩu.";
      return;
    }

    taiKhoanDangNhap = taiKhoan;
    oTaiKhoan.value = "";
    oMatKhau.value = "";
    oThongBaoLoi.textContent = "";
    hienThiManHinh();
  }
  function dangXuat() {
    taiKhoanDangNhap = null;
    hienThiManHinh();
  }
  function hienThiManHinh() {
    if (taiKhoanDangNhap === null) {
      oManHinhDangNhap.style.display = "block";
      oManHinhCuaHang.style.display = "none";
    } else {
      oManHinhDangNhap.style.display = "none";
      oManHinhCuaHang.style.display = "block";
      oTenDangNhap.textContent = taiKhoanDangNhap;
    }
  }
  let danhSachSanPham = [
    { id: "SP001", ten: "Áo thun", gia: 150000 },
    { id: "SP002", ten: "Quần jean", gia: 350000 },
    { id: "SP003", ten: "Giày sneaker", gia: 500000 },
    { id: "SP004", ten: "Mũ lưỡi trai", gia: 80000 },
    { id: "SP005", ten: "Balo", gia: 250000 }
  ];
  let gioHang = [];
  const oBangSanPham = document.getElementById("bangSanPham");
  const oBangGioHang = document.getElementById("bangGioHang");
  const oTongTien = document.getElementById("tongTien");

  function dinhDangTien(soTien) {
    return soTien.toLocaleString("vi-VN") + "đ";
  }
  function timSanPham(id) {
    for (let i = 0; i < danhSachSanPham.length; i++) {
      if (danhSachSanPham[i].id === id) {
        return danhSachSanPham[i];
      }
    }
    return null;
  }
  function hienThiSanPham() {
    let html = "";
    for (let i = 0; i < danhSachSanPham.length; i++) {
      const sp = danhSachSanPham[i];
      html += "<tr>" +
                "<td>" + sp.ten + "</td>" +
                "<td>" + dinhDangTien(sp.gia) + "</td>" +
                '<td><button class="btn-them" onclick="themVaoGio(\'' + sp.id + '\')">Thêm</button></td>' +
              "</tr>";
    }
    oBangSanPham.innerHTML = html;
  }
  function hienThiGioHang() {
    if (gioHang.length === 0) {
      oBangGioHang.innerHTML = '<div class="gio-trong">Giỏ hàng đang trống</div>';
      oTongTien.textContent = dinhDangTien(0);
      return;
    }
    let html = "<table><thead><tr><th>Sản phẩm</th><th>SL</th><th>Thành tiền</th><th></th></tr></thead><tbody>";
    let tong = 0;
    for (let i = 0; i < gioHang.length; i++) {
      const item = gioHang[i];
      const thanhTien = item.gia * item.soLuong;
      tong += thanhTien;
      html += "<tr>" +
                "<td>" + item.ten + "</td>" +
                "<td>" + item.soLuong + "</td>" +
                "<td>" + dinhDangTien(thanhTien) + "</td>" +
                '<td><button class="btn-xoa" onclick="xoaKhoiGio(' + i + ')">Xóa</button></td>' +
              "</tr>";
    }
    html += "</tbody></table>";
    oBangGioHang.innerHTML = html;
    oTongTien.textContent = dinhDangTien(tong);
  }
  function themVaoGio(id) {
    const sp = timSanPham(id);
    if (sp === null) return;
    for (let i = 0; i < gioHang.length; i++) {
      if (gioHang[i].id === id) {
        gioHang[i].soLuong++;
        hienThiGioHang();
        return;
      }
    }
    gioHang.push({ id: sp.id, ten: sp.ten, gia: sp.gia, soLuong: 1 });
    hienThiGioHang();
  }

  function xoaKhoiGio(viTri) {
    gioHang.splice(viTri, 1);
    hienThiGioHang();
  }

  function thanhToan() {
    if (gioHang.length === 0) {
      alert("Giỏ hàng đang trống!");
      return;
    }
    alert("Thanh toán thành công! Tổng tiền: " + oTongTien.textContent);
    gioHang = [];
    hienThiGioHang();
  }
  hienThiManHinh();
  hienThiSanPham();
  hienThiGioHang();
  </script>
  </body>
</html>
