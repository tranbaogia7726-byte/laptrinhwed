<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Todo List</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: "Segoe UI", Arial, sans-serif;
    background: #f4f6f8;
    margin: 0;
    padding: 24px;
    color: #222;
  }
  h1 { text-align: center; color: #2c3e50; }
  .container {
    max-width: 500px;
    margin: 0 auto;
    background: #fff;
    padding: 24px;
    border-radius: 8px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
  }
  .form-nhap {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
  }
  #noiDung {
    flex: 1;
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 4px;
    font-size: 14px;
  }
  button {
    cursor: pointer;
    border: none;
    border-radius: 4px;
    padding: 10px 16px;
    font-size: 14px;
  }
  #btnThem { background: #2ecc71; color: #fff; }
  #btnThem:hover { background: #27ae60; }
  ul { list-style: none; padding: 0; margin: 0; }
  li {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px;
    border-bottom: 1px solid #eee;
  }
  li:hover { background: #f9f9f9; }
  li input[type="checkbox"] { width: 18px; height: 18px; cursor: pointer; }
  .noi-dung {
    flex: 1;
    font-size: 15px;
  }
  .hoan-thanh {
    text-decoration: line-through;
    color: #999;
  }
  .btn-xoa {
    background: #e74c3c;
    color: #fff;
    padding: 6px 12px;
  }
  .btn-xoa:hover { background: #c0392b; }
</style>
</head>
<body>

<div class="container">
  <h1>Todo List</h1>

  <!-- Ô nhập công việc mới -->
  <div class="form-nhap">
    <input type="text" id="noiDung" placeholder="Nhập công việc cần làm...">
    <button id="btnThem" onclick="themCongViec()">Thêm</button>
  </div>

  <!-- DANH SÁCH CÔNG VIỆC -->
  <ul id="danhSach">
    <!-- JS sẽ điền dữ liệu vào đây -->
  </ul>
</div>

<script>
  let danhSachCV = [
    { id: 1, noiDung: "Học bài JavaScript", hoanThanh: false },
    { id: 2, noiDung: "Làm bài tập về nhà", hoanThanh: true },
    { id: 3, noiDung: "Ôn thi giữa kỳ", hoanThanh: false }
  ];

  // Biến đếm để cấp id mới cho công việc tiếp theo được thêm vào
  let idTiepTheo = 4;
  const oNoiDung = document.getElementById("noiDung");
  const oDanhSach = document.getElementById("danhSach");
  function timViTri(id) {
    for (let i = 0; i < danhSachCV.length; i++) {
      if (danhSachCV[i].id === id) {
        return i;
      }
    }
    return -1;
  }
  function hienThiDanhSach() {
    let html = "";
    for (let i = 0; i < danhSachCV.length; i++) {
      const cv = danhSachCV[i];
      html += "<li>" +
                '<input type="checkbox" ' + (cv.hoanThanh ? "checked" : "") +
                ' onchange="toggleHoanThanh(' + cv.id + ')">' +
                '<span class="noi-dung ' + (cv.hoanThanh ? "hoan-thanh" : "") + '">' + cv.noiDung + "</span>" +
                '<button class="btn-xoa" onclick="xoaCongViec(' + cv.id + ')">Xóa</button>' +
              "</li>";
    }
    oDanhSach.innerHTML = html;
  }

  function themCongViec() {
    const noiDung = oNoiDung.value;
    danhSachCV.push({ id: idTiepTheo, noiDung: noiDung, hoanThanh: false });
    idTiepTheo++;
    oNoiDung.value = "";
    hienThiDanhSach();
  }

  function xoaCongViec(id) {
    const viTri = timViTri(id);
    danhSachCV.splice(viTri, 1);
    hienThiDanhSach();
  }
  function toggleHoanThanh(id) {
    const viTri = timViTri(id);
    danhSachCV[viTri].hoanThanh = !danhSachCV[viTri].hoanThanh;
    hienThiDanhSach();
  }
  hienThiDanhSach();

</script>

</body>
</html>
