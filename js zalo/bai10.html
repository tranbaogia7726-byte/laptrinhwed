<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Bài 10 - sumOfSquares</title>
</head>
<body>
  <h2>Bài 10: sumOfSquares</h2>
  <script>
    function print(x) {
      document.write("<p>" + (typeof x === "object" ? JSON.stringify(x) : x) + "</p>");
    }

    function sumOfSquares(arr) {
      let sum = 0;
      for (let i = 0; i < arr.length; i++) {
        sum += arr[i] * arr[i];
      }
      return sum;
    }

    print(sumOfSquares([1, 2, 3])); // 14
    print(sumOfSquares([4, 5, 6])); // 77
  </script>
</body>
</html>
