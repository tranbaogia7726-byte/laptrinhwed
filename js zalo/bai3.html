<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Bài 3 - findMin</title>
</head>
<body>
  <h2>Bài 3: findMin</h2>
  <script>
    function print(x) {
      document.write("<p>" + (typeof x === "object" ? JSON.stringify(x) : x) + "</p>");
    }

    function findMin(arr) {
      let min = arr[0];
      for (let i = 1; i < arr.length; i++) {
        if (arr[i] < min) {
          min = arr[i];
        }
      }
      return min;
    }

    print(findMin([5, 2, 8, 1, 4])); // 1
  </script>
</body>
</html>
