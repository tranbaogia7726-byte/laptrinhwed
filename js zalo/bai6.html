<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Bài 6 - calculateAverage</title>
</head>
<body>
  <h2>Bài 6: calculateAverage</h2>
  <script>
    function print(x) {
      document.write("<p>" + (typeof x === "object" ? JSON.stringify(x) : x) + "</p>");
    }

    function calculateAverage(arr) {
      if (arr.length === 0) {
        return 0;
      }
      let sum = 0;
      for (let i = 0; i < arr.length; i++) {
        sum += arr[i];
      }
      return sum / arr.length;
    }

    print(calculateAverage([10, 20, 30, 40, 50])); // 30
    print(calculateAverage([]));                   // 0
  </script>
</body>
</html>
