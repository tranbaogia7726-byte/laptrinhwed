<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Bài 7 - isAscending</title>
</head>
<body>
  <h2>Bài 7: isAscending</h2>
  <script>
    function print(x) {
      document.write("<p>" + (typeof x === "object" ? JSON.stringify(x) : x) + "</p>");
    }

    function isAscending(arr) {
      // Mảng rỗng hoặc chỉ có 1 phần tử không được coi là tăng dần
      if (arr.length < 2) {
        return false;
      }
      for (let i = 1; i < arr.length; i++) {
        if (arr[i] <= arr[i - 1]) {
          return false;
        }
      }
      return true;
    }

    print(isAscending([1, 2, 3, 5])); // true
    print(isAscending([1, 3, 2]));    // false
    print(isAscending([5]));          // false
  </script>
</body>
</html>
