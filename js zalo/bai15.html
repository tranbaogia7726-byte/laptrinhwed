<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Bài 15 - removeDuplicates</title>
</head>
<body>
  <h2>Bài 15: removeDuplicates</h2>
  <script>
    function print(x) {
      document.write("<p>" + (typeof x === "object" ? JSON.stringify(x) : x) + "</p>");
    }

    function removeDuplicates(arr) {
      const result = [];
      for (let i = 0; i < arr.length; i++) {
        if (!result.includes(arr[i])) {
          result.push(arr[i]);
        }
      }
      return result;
    }

    print(removeDuplicates([1, 2, 2, 3, 4, 4, 5])); // [1,2,3,4,5]
  </script>
</body>
</html>
