<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Bài 4 - countPositiveNumbers</title>
</head>
<body>
  <h2>Bài 4: countPositiveNumbers</h2>
  <script>
    function print(x) {
      document.write("<p>" + (typeof x === "object" ? JSON.stringify(x) : x) + "</p>");
    }

    function countPositiveNumbers(arr) {
      let count = 0;
      for (let i = 0; i < arr.length; i++) {
        if (arr[i] > 0) {
          count++;
        }
      }
      return count;
    }

    print(countPositiveNumbers([-1, 2, 3, -4, 5])); // 3
  </script>
</body>
</html>
